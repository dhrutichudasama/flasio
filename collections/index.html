<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection - Flasio</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Poppins&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        .collection-section {
            padding: 60px 0;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        @media (max-width: 1024px) {
            .collection-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .collection-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .collection-grid {
                grid-template-columns: 1fr;
            }
        }

        /* SAME IMAGE STYLE (unchanged) */
        .collection-grid .product-img {
            width: 100%;
             height: 260px; 
            aspect-ratio: 4 / 5;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }

        .collection-grid .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: 0.4s ease;
        }

        .product:hover .product-img img {
            filter: blur(0px) brightness(0.8);
        }

        /* Button container */
        .view-all-btn {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: all 0.4s ease;
        }

        /* Hover par slide-up */
        .product:hover .view-all-btn {
            bottom: 20px;
            opacity: 1;
        }

        /* Button style */
        .view-all-btn button {
            width: 120px;
            height: 40px;
            background: #fff;
            border: none;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        /* Hover color */
        .view-all-btn button:hover {
            background: #0c4a30;
            color: #fff;
        }
        .product{
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
        }
        .product h4{
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 5px;
        }
        .product p{
            color: #666;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div id="header"></div>

    <!-- MAIN SECTION -->
    <div class="collection-section">
        <div class="container">

            <!-- GRID -->
            <div class="collection-grid">

                <!-- SAME CARDS (unchanged) -->
                <div class="product">
                    <div class="product-img">
                        <a href="#"><img src="../assets/images/col1.avif"></a>
                        <div class="view-all-btn">
                            <a href="frontpage.html"><button>View All</button></a>
                        </div>
                    </div>
                    <h4>Low Mantanance</h4>
                    <p>8 products</p>
                </div>

                <div class="product">
                    <div class="product-img">
                        <a href="#"><img src="../assets/images/col2.avif"></a>
                        <div class="view-all-btn">
                            <a href="frontpage.html"><button>View All</button></a>
                        </div>
                    </div>
                    <h4>Air Purifying</h4>
                    <p>6 products</p>
                </div>

                <div class="product">
                    <div class="product-img">
                        <a href="#"><img src="../assets/images/col3.avif"></a>
                        <div class="view-all-btn">
                            <a href="frontpage.html"><button>View All</button></a>
                        </div>
                    </div>
                    <h4>Herb Seeds</h4>
                    <p>6 products</p>
                </div>

                <div class="product">
                    <div class="product-img">
                        <a href="#"><img src="../assets/images/col4.avif"></a>
                        <div class="view-all-btn">
                            <a href="frontpage.html"><button>View All</button></a>
                        </div>
                    </div>
                    <h4>Indoor Plants</h4>
                    <p>6 products</p>
                </div>

                <div class="product">
                    <div class="product-img">
                        <a href="#"><img src="../assets/images/col5.avif"></a>
                        <div class="view-all-btn">
                            <a href="frontpage.html"><button>View All</button></a>
                        </div>
                    </div>
                    <h4>Plant Bundle</h4>
                    <p>4 products</p>
                </div>

            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- JS -->
    <script src="../assets/js/script.js"></script>
    <script src="../assets/js/include.js"></script>
    <script>
        initIncludes('..');
    </script>

</body>

</html>
