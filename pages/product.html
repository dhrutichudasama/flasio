<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product</title>

<link rel="stylesheet" href="../style.css">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* MAIN */
.main {
    display: flex;
    justify-content: center;
    padding: 40px 20px;
}

.container {
    max-width: 900px;
    width: 100%;
    text-align: center;
}

/* IMAGE SLIDER */
.product-images {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.main-image {
    width: 100%;
    max-width: 500px;
    height: 450px;
    object-fit: cover;
}

/* THUMBNAILS */
.thumbnail-container {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.thumbnail {
    width: 80px;
    height: 80px;
    cursor: pointer;
    object-fit: cover;
    border: 2px solid transparent;
}

.thumbnail.active {
    border: 2px solid black;
}

/* DETAILS */
.product-details {
    margin-top: 30px;
}

.product-title {
    font-size: 26px;
    margin-bottom: 10px;
}

.price {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
}

.desc {
    color: #555;
    margin-bottom: 20px;
}

button {
    padding: 12px 25px;
    border: none;
    background: black;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- HEADER -->
<div id="header"></div>

<div class="main">
    <div class="container">

        <!-- IMAGE -->
        <div class="product-images">
            <img id="mainImage" src="../images/product-1.webp" class="main-image">

            <div class="thumbnail-container">
                <img src="../images/product-1.webp" class="thumbnail active">
                <img src="../images/product-2.webp" class="thumbnail">
                <img src="../images/product-3.webp" class="thumbnail">
            </div>
        </div>

        <!-- DETAILS -->
        <div class="product-details">
            <h1 class="product-title">Jade Succulent</h1>
            <div class="price">$60.00</div>
            <p class="desc">
                Beautiful indoor plant perfect for decoration. Easy to maintain and long lasting.
            </p>

            <button>Add to Cart</button>
        </div>

    </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<script>
/* IMAGE SWITCH */
const mainImage = document.getElementById("mainImage");
const thumbnails = document.querySelectorAll(".thumbnail");

thumbnails.forEach(img => {
    img.addEventListener("click", () => {
        mainImage.src = img.src;

        thumbnails.forEach(t => t.classList.remove("active"));
        img.classList.add("active");
    });
});

/* HEADER FOOTER */
const BASE_URL = "/flasio/";

function loadComponent(id, file) {
    fetch(BASE_URL + file)
        .then(res => res.text())
        .then(data => {
            document.getElementById(id).innerHTML = data;
        });
}

loadComponent("header", "header.html");
loadComponent("footer", "footer.html");
</script>

</body>
</html>
