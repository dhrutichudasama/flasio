<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flasio</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff;
            margin: 0;
        }

        /* Layout wrapper */
        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Center section */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Register box */
        .register-container {
            background: #fff;
            padding: 30px;
            width: 550px;
            margin-bottom: 50px;
        }

        .register-container h2 {
            text-align: center;
            margin: 40px;
            font-family: 'Libre Baskerville', serif;
            font-size: 40px;
        }

        .register-container input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
        }

        .register-container p {
            font-size: 15px;
            color: #555;
            margin: 10px 0;
            line-height: 1.5;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            background: black;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .signin-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #fff;
            border: 1px solid #000;
            cursor: pointer;
        }
        .signin-btn:hover,
        .register-btn:hover{
            background: #224229;
            color: #fff;
        }
</style>
</head>
<body>

<div class="page-wrapper">

    <!-- Header -->
    <div id="header"></div>

    <!-- Center Content -->
    <div class="main-content">
        <div class="register-container">
            <h2>Create Account</h2>

            <form>
                <input type="text" placeholder="First Name" required>
                <input type="text" placeholder="Last Name" required>
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>

                <p>
                    Sign up for early Sale access plus tailored new arrivals, trends and promotions. 
                    To opt out, click unsubscribe in our emails.
                </p>

                <button type="submit" class="register-btn">Register</button>
            </form>

            <button class="signin-btn" onclick="window.location.href='login.html'">
                Sign In
            </button>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer"></div>

</div>

<script src="script.js"></script>
<script src="include.js"></script>

</body>
</html>
