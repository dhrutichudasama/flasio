<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flasio</title>
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff;
            margin: 0;
        }

        /* Layout */
        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container */
        .register-container {
            width: 1000px;
            padding: 40px;
            margin-bottom: 50px;
        }

        /* Title */
        .register-container h2 {
            text-align: center;
            margin: 50px;
            font-family: 'Libre Baskerville', serif;
            font-size: 40px;
        }

        /* 2 column layout */
        .login-con {
            display: flex;
            gap: 50px;
        }

        /* Left & Right */
        .con1,
        .con2 {
            flex: 1;
        }

        /* Divider (optional but looks pro) */
        .con1 {
            border-right: 1px solid #ddd;
            padding-right: 30px;
        }
        .con1 p{
            text-align: left;
            text-decoration: underline;
        }
        .con2 {
            padding-left: 30px;
        }

        /* Inputs */
        .register-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }
        .register-container input:focus{
            outline: 1px solid black;
        }

        /* Text */
        .register-container p {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Buttons */
        .signin-btn,
        .register-btn {
            width: 100%;
            padding: 12px;
            border: none;
            cursor: pointer;
        }

        /* Button styles */
        .signin-btn {
            background: black;
            color: #fff;
        }

        .register-btn {
            background: #fff;
            border: 1px solid #000;
        }

        /* Hover */
        .signin-btn:hover,
        .register-btn:hover {
            background: #224229;
            color: #fff;
        }
        @media (max-width: 768px) {
            .login-con {
                flex-direction: column;
            }
            .con1 {
                border-right: none;
                padding-right: 0;
            }
            .con2 {
                padding-left: 0;
            }
        }
    </style>
</head>

<body>

    <div class="page-wrapper">

        <!-- Header -->
        <div id="header"></div>

        <!-- Center Content -->
        <div class="main-content">
            <div class="register-container">
                <h2>Account</h2>

                <form>
                    <div class="login-con">
                        <div class="con1">
                            <input type="email" placeholder="Email Address" required>
                            <input type="password" placeholder="Password" required>
                            <p>Lost your password ?</p>
                            <button class="signin-btn" onclick="window.location.href='login.html'">
                                Sign In
                            </button>
                        </div>
                        <div class="con2">
                            <h3>New customer?</h3>
                            <p>
                                Sign up for early Sale access plus tailored new arrivals, trends and promotions.
                                To opt out, click unsubscribe in our emails.
                            </p>

                            <button type="submit" class="register-btn" onclick="window.location.href='register.html'">Register</button>
                        </div>
                    </div>

                </form>


            </div>
        </div>

        <!-- Footer -->
        <div id="footer"></div>

    </div>

<script src="assets/js/script.js"></script>
<script src="assets/js/include.js"></script>
<script>initIncludes('.');</script>

</body>

</html>
